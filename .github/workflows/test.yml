name: Tests
on:
  push:
    branches-ignore:
      # Promotion preserves the SHA already checked on its preparation branch.
      # This branch requires successful unit-tests, including for administrators.
      - codex/live-number-checks
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run check
      - name: Build application
        run: npm run build
      - run: npm run check:ga4-kpi-certification
      - name: Retained deferred-source evidence (non-blocking)
        continue-on-error: true
        run: npm run test:deferred
  test-groups:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: v1_audit
          POSTGRES_DB: ga4_alignment_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55444:5432
        options: >-
          --health-cmd "pg_isready -U v1_audit -d ga4_alignment_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ''
      GA4_TEST_DATABASE_URL: postgresql://v1_audit@127.0.0.1:55444/ga4_alignment_test
      NOTIFICATION_TEST_DATABASE_URL: postgresql://v1_audit@127.0.0.1:55444/notifications_test
      V1_BATCH7_PRESERVE_ARTIFACTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Create isolated notification fixture database
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ host: '127.0.0.1', port: 55444, user: 'v1_audit', database: 'ga4_alignment_test' });
          try { await client.connect(); await client.query('CREATE DATABASE notifications_test'); }
          finally { await client.end(); }
          NODE
      - run: npm run test:current-version
        env:
          CURRENT_VERSION_TEST_SHARD: ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        with:
          name: current-version-shard-${{ matrix.shard }}
          path: .ci-test-results/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  unit-tests:
    if: ${{ always() }}
    needs: [build-checks, test-groups]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every build and test group to succeed
        env:
          BUILD_RESULT: ${{ needs.build-checks.result }}
          TEST_RESULT: ${{ needs.test-groups.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: current-version-shard-*
          path: .ci-test-results
          merge-multiple: true
      - name: Verify complete test-file coverage for this commit and run
        run: node --import tsx scripts/ga4-kpi-current-version-test-boundary.ts verify-shards
        env:
          DATABASE_URL: ''
          CURRENT_VERSION_TEST_SHARD_COUNT: '3'
